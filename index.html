<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curax</title>
  <script>
  (function(){
    var m = localStorage.getItem('curax-mode') || 'light';
    var t = localStorage.getItem('curax-theme') || 'portfolio';
    document.documentElement.setAttribute('data-mode', m);
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="themes.js"></script>
</head>
<body>
  <a href="#content" class="skip-link">Aller au contenu</a>
  <header>
    <div class="header-content">
      <div>
        <h1>Curax</h1>
        <p id="subtitle">Curation IA d'articles et publications</p>
      </div>
      <div class="theme-controls">
        <select id="theme-select" aria-label="Thème">
          <option value="portfolio">Portfolio</option>
          <option value="sage-green">Sage Green</option>
          <option value="offworld">Offworld</option>
        </select>
        <button id="mode-toggle" type="button" aria-label="Basculer light/dark">
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
  </header>

  <nav class="tab-bar" id="tab-bar" role="tablist" aria-label="Type de contenu">
    <button class="tab-button active" data-tab="twitter" type="button" role="tab" id="tab-btn-twitter" aria-selected="true" aria-controls="tab-twitter">
      <span class="tab-icon">📰</span> Twitter
    </button>
    <button class="tab-button" data-tab="medium" type="button" role="tab" id="tab-btn-medium" aria-selected="false" aria-controls="tab-medium">
      <span class="tab-icon">📝</span> Medium
    </button>
    <button class="tab-button" data-tab="linkedin" type="button" role="tab" id="tab-btn-linkedin" aria-selected="false" aria-controls="tab-linkedin">
      <span class="tab-icon">💼</span> LinkedIn
    </button>
    <button class="tab-button" data-tab="publications" type="button" role="tab" id="tab-btn-publications" aria-selected="false" aria-controls="tab-publications">
      <span class="tab-icon">🎓</span> Publications
    </button>
  </nav>

  <div class="search-bar">
    <div class="search-bar-content">
      <input type="text" id="search-input" placeholder="Rechercher dans les articles..." aria-label="Rechercher">
      <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filter-panel">
        <span class="filter-toggle-icon">&#9881;</span> Filtres
        <span id="filter-count" class="filter-count" style="display:none"></span>
      </button>
      <span id="results-count" class="results-count" style="display:none"></span>
    </div>
    <div id="filter-panel" class="filter-panel" aria-hidden="true">
      <div class="filter-panel-content">
        <div class="filter-group">
          <label for="filter-score">Score min :</label>
          <input type="range" id="filter-score" min="0" max="10" value="0" step="1">
          <span id="filter-score-value">0</span>
        </div>
        <div class="filter-group">
          <label for="filter-domain">Domaine :</label>
          <select id="filter-domain" aria-label="Filtrer par domaine">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Tags :</label>
          <div id="filter-tags" class="filter-tags"></div>
        </div>
        <button type="button" id="filter-reset" class="filter-reset" style="display:none">Réinitialiser</button>
      </div>
    </div>
  </div>

  <main id="content">
    <div id="tab-twitter" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-twitter">
      <div class="welcome-message" id="loading">
        <p>Chargement...</p>
      </div>
    </div>
    <div id="tab-medium" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-medium" style="display:none"></div>
    <div id="tab-linkedin" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-linkedin" style="display:none"></div>
    <div id="tab-publications" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-publications" style="display:none"></div>
  </main>

  <footer>
    <p>Généré automatiquement via GitHub Actions</p>
  </footer>

  <script>
    // ── Theme definitions (loaded from themes.js) ──
    var THEMES = CURAX_THEMES;

    // ── Theme switching logic ──
    var currentMode = localStorage.getItem('curax-mode') || 'light';
    var currentTheme = localStorage.getItem('curax-theme') || 'portfolio';

    function applyTheme(themeId, mode) {
      var theme = THEMES[themeId];
      if (!theme) return;
      var styles = theme[mode];
      var root = document.documentElement;

      root.style.cssText = '';
      for (var key in styles) {
        root.style.setProperty('--' + key, styles[key]);
      }

      root.setAttribute('data-mode', mode);
      root.setAttribute('data-theme', themeId);
      localStorage.setItem('curax-theme', themeId);
      localStorage.setItem('curax-mode', mode);
      currentTheme = themeId;
      currentMode = mode;

      updateToggleIcon();
    }

    function updateToggleIcon() {
      var moon = document.getElementById('icon-moon');
      var sun = document.getElementById('icon-sun');
      if (currentMode === 'dark') {
        moon.style.display = 'none';
        sun.style.display = 'block';
      } else {
        moon.style.display = 'block';
        sun.style.display = 'none';
      }
    }

    // Init theme
    var themeSelect = document.getElementById('theme-select');
    var modeToggle = document.getElementById('mode-toggle');

    themeSelect.value = currentTheme;
    applyTheme(currentTheme, currentMode);

    themeSelect.addEventListener('change', function() {
      applyTheme(this.value, currentMode);
    });

    modeToggle.addEventListener('click', function() {
      var newMode = currentMode === 'light' ? 'dark' : 'light';
      applyTheme(currentTheme, newMode);
    });

    // ── Tab switching ──
    var TAB_SOURCES = { twitter: 'twitter', medium: 'medium', linkedin: 'linkedin' };
    var TAB_LABELS = { twitter: 'articles Twitter', medium: 'articles Medium', linkedin: 'articles LinkedIn', publications: 'publications' };
    var currentTab = localStorage.getItem('curax-tab') || 'twitter';
    if (currentTab === 'articles') currentTab = 'twitter';

    function switchTab(tabId) {
      currentTab = tabId;
      localStorage.setItem('curax-tab', tabId);

      document.querySelectorAll('.tab-content').forEach(function(el) {
        el.style.display = 'none';
      });
      var target = document.getElementById('tab-' + tabId);
      if (target) target.style.display = '';

      document.querySelectorAll('.tab-button').forEach(function(btn) {
        var isActive = btn.getAttribute('data-tab') === tabId;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });

      updateSubtitle(tabId);

      // Update filter UI for this tab (if filters initialized)
      if (window._manifest) {
        populateFilterUI(tabId);
        if (hasActiveFilters(window._filters[tabId])) {
          applyFilters();
        }
      }
    }

    function updateSubtitle(tabId) {
      var sub = document.getElementById('subtitle');
      sub.textContent = (window._tabSubtitles && window._tabSubtitles[tabId]) || '';
    }

    document.querySelectorAll('.tab-button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        switchTab(this.getAttribute('data-tab'));
      });
    });

    // Keyboard navigation for tabs (arrow keys)
    document.getElementById('tab-bar').addEventListener('keydown', function(e) {
      var tabs = Array.from(this.querySelectorAll('.tab-button'));
      var idx = tabs.indexOf(document.activeElement);
      if (idx < 0) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        var next = tabs[(idx + 1) % tabs.length];
        next.focus();
        switchTab(next.getAttribute('data-tab'));
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        var prev = tabs[(idx - 1 + tabs.length) % tabs.length];
        prev.focus();
        switchTab(prev.getAttribute('data-tab'));
      }
    });

    // ── Search & filter state ──
    window._tabSubtitles = {};
    window._filters = {
      twitter:      { query: '', scoreMin: 0, domain: '', tags: [] },
      medium:       { query: '', scoreMin: 0, domain: '', tags: [] },
      linkedin:     { query: '', scoreMin: 0, domain: '', tags: [] },
      publications: { query: '', scoreMin: 0, domain: '', tags: [] }
    };

    function debounce(fn, delay) {
      var timer;
      return function() {
        clearTimeout(timer);
        timer = setTimeout(fn, delay);
      };
    }

    function collectAllTags(tabId) {
      var tags = {};
      var items = [];
      var source = TAB_SOURCES[tabId];
      if (source) {
        var domains = (window._manifest && window._manifest.domains) || [];
        for (var i = 0; i < domains.length; i++) {
          var arts = domains[i].articles || [];
          for (var j = 0; j < arts.length; j++) {
            if ((arts[j].source || 'twitter') === source) items.push(arts[j]);
          }
        }
        var uncat = (window._manifest && window._manifest.uncategorized) || [];
        for (var i = 0; i < uncat.length; i++) {
          if ((uncat[i].source || 'twitter') === source) items.push(uncat[i]);
        }
      } else {
        var pDomains = (window._manifest && window._manifest.papers && window._manifest.papers.domains) || [];
        for (var i = 0; i < pDomains.length; i++) {
          items = items.concat(pDomains[i].papers || []);
        }
      }
      for (var i = 0; i < items.length; i++) {
        var t = items[i].tags || [];
        for (var j = 0; j < t.length; j++) {
          tags[t[j]] = (tags[t[j]] || 0) + 1;
        }
      }
      return Object.keys(tags).sort(function(a, b) { return tags[b] - tags[a]; }).slice(0, 20);
    }

    function collectDomains(tabId) {
      var source = TAB_SOURCES[tabId];
      if (source) {
        var allDomains = (window._manifest && window._manifest.domains) || [];
        var filtered = [];
        for (var i = 0; i < allDomains.length; i++) {
          var arts = allDomains[i].articles || [];
          for (var j = 0; j < arts.length; j++) {
            if ((arts[j].source || 'twitter') === source) { filtered.push(allDomains[i]); break; }
          }
        }
        return filtered;
      }
      return (window._manifest && window._manifest.papers && window._manifest.papers.domains) || [];
    }

    function buildFilterPredicate(f) {
      return function(item) {
        if (f.scoreMin > 0 && (!item.quality_score || item.quality_score < f.scoreMin)) return false;
        if (f.domain && item._domainSlug !== f.domain) return false;
        if (f.tags.length > 0) {
          var itemTags = item.tags || [];
          var match = false;
          for (var i = 0; i < f.tags.length; i++) {
            if (itemTags.indexOf(f.tags[i]) !== -1) { match = true; break; }
          }
          if (!match) return false;
        }
        if (f.query) {
          var q = f.query.toLowerCase();
          var haystack = (item.title || '') + ' ' + (item.description || '') + ' ' + (item.tags || []).join(' ') + ' ' + (item.keywords || []).join(' ') + ' ' + ((item.authors || []).join(' ')) + ' ' + (item.author || '');
          if (haystack.toLowerCase().indexOf(q) === -1) return false;
        }
        return true;
      };
    }

    function hasActiveFilters(f) {
      return f.query !== '' || f.scoreMin > 0 || f.domain !== '' || f.tags.length > 0;
    }

    function populateFilterUI(tabId) {
      var domainSelect = document.getElementById('filter-domain');
      var domains = collectDomains(tabId);
      domainSelect.innerHTML = '<option value="">Tous</option>';
      for (var i = 0; i < domains.length; i++) {
        var opt = document.createElement('option');
        opt.value = domains[i].slug;
        opt.textContent = (domains[i].icon || '') + ' ' + (domains[i].name || domains[i].slug);
        domainSelect.appendChild(opt);
      }

      var tagsContainer = document.getElementById('filter-tags');
      var allTags = collectAllTags(tabId);
      tagsContainer.innerHTML = '';
      for (var i = 0; i < allTags.length; i++) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'filter-tag';
        chip.textContent = allTags[i];
        chip.setAttribute('data-tag', allTags[i]);
        chip.addEventListener('click', (function(tag) {
          return function() { toggleTag(tag); };
        })(allTags[i]));
        tagsContainer.appendChild(chip);
      }

      var searchInput = document.getElementById('search-input');
      searchInput.placeholder = 'Rechercher dans les ' + (TAB_LABELS[tabId] || 'articles') + '...';

      var f = window._filters[tabId];
      searchInput.value = f.query;
      document.getElementById('filter-score').value = f.scoreMin;
      document.getElementById('filter-score-value').textContent = f.scoreMin;
      domainSelect.value = f.domain;
      var tagChips = tagsContainer.querySelectorAll('.filter-tag');
      tagChips.forEach(function(c) {
        c.classList.toggle('active', f.tags.indexOf(c.getAttribute('data-tag')) !== -1);
      });

      updateFilterBadges(tabId);
    }

    function updateFilterBadges(tabId) {
      var f = window._filters[tabId];
      var active = hasActiveFilters(f);
      var countBadge = document.getElementById('filter-count');
      var resetBtn = document.getElementById('filter-reset');
      if (active) {
        var n = (f.query ? 1 : 0) + (f.scoreMin > 0 ? 1 : 0) + (f.domain ? 1 : 0) + f.tags.length;
        countBadge.textContent = n;
        countBadge.style.display = '';
        resetBtn.style.display = '';
      } else {
        countBadge.style.display = 'none';
        resetBtn.style.display = 'none';
      }
    }

    function applyFilters() {
      var tabId = currentTab;
      var f = window._filters[tabId];
      var filterFn = hasActiveFilters(f) ? buildFilterPredicate(f) : null;

      var container = document.getElementById('tab-' + tabId);
      var source = TAB_SOURCES[tabId];
      if (source) {
        renderArticlesTab(window._manifest, container, filterFn, source);
      } else {
        renderPublicationsTab(window._manifest, container, filterFn);
      }

      var resultsEl = document.getElementById('results-count');
      if (filterFn) {
        var subtitle = (window._tabSubtitles && window._tabSubtitles[tabId]) || '';
        var count = subtitle.match(/^\d+/);
        resultsEl.textContent = (count ? count[0] : '0') + ' résultats';
        resultsEl.style.display = '';
      } else {
        resultsEl.style.display = 'none';
      }

      updateSubtitle(tabId);
      updateFilterBadges(tabId);
    }

    function toggleTag(tag) {
      var f = window._filters[currentTab];
      var idx = f.tags.indexOf(tag);
      if (idx === -1) f.tags.push(tag);
      else f.tags.splice(idx, 1);
      var chips = document.getElementById('filter-tags').querySelectorAll('.filter-tag');
      chips.forEach(function(c) {
        c.classList.toggle('active', f.tags.indexOf(c.getAttribute('data-tag')) !== -1);
      });
      applyFilters();
    }

    function resetFilters() {
      var f = window._filters[currentTab];
      f.query = '';
      f.scoreMin = 0;
      f.domain = '';
      f.tags = [];
      populateFilterUI(currentTab);
      applyFilters();
    }

    function initFilters() {
      var searchInput = document.getElementById('search-input');
      var filterToggle = document.getElementById('filter-toggle');
      var filterPanel = document.getElementById('filter-panel');
      var scoreSlider = document.getElementById('filter-score');
      var scoreValue = document.getElementById('filter-score-value');
      var domainSelect = document.getElementById('filter-domain');
      var resetBtn = document.getElementById('filter-reset');

      var debouncedApply = debounce(applyFilters, 200);
      searchInput.addEventListener('input', function() {
        window._filters[currentTab].query = this.value;
        debouncedApply();
      });

      filterToggle.addEventListener('click', function() {
        var isOpen = filterPanel.classList.toggle('open');
        filterToggle.setAttribute('aria-expanded', isOpen);
        filterPanel.setAttribute('aria-hidden', !isOpen);
      });

      scoreSlider.addEventListener('input', function() {
        scoreValue.textContent = this.value;
        window._filters[currentTab].scoreMin = parseInt(this.value, 10);
        applyFilters();
      });

      domainSelect.addEventListener('change', function() {
        window._filters[currentTab].domain = this.value;
        applyFilters();
      });

      resetBtn.addEventListener('click', function() {
        resetFilters();
      });

      populateFilterUI(currentTab);
    }

    // ── Shared helpers ──
    function scoreClass(s) {
      if (s <= 2) return 'quality-low';
      if (s <= 4) return 'quality-below';
      if (s <= 6) return 'quality-mid';
      if (s <= 8) return 'quality-good';
      return 'quality-great';
    }

    function buildObservationsBox(text) {
      var obs = document.createElement("section");
      obs.className = "observations";
      var obsTitle = document.createElement("h2");
      obsTitle.textContent = "Analyse du corpus";
      obs.appendChild(obsTitle);
      var obsText = document.createElement("p");
      obsText.textContent = text;
      obs.appendChild(obsText);
      return obs;
    }

    function buildNoResults() {
      var div = document.createElement("div");
      div.className = "no-results";
      var p = document.createElement("p");
      var query = window._filters ? window._filters[currentTab].query : '';
      p.textContent = query ? 'Aucun résultat pour « ' + query + ' »' : 'Aucun résultat avec ces filtres';
      div.appendChild(p);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Réinitialiser les filtres";
      btn.addEventListener("click", function() { resetFilters(); });
      div.appendChild(btn);
      return div;
    }

    function buildDomainSection(domain, cardBuilder) {
      var section = document.createElement("section");
      section.className = "domain-section";

      var header = document.createElement("div");
      header.className = "domain-header";
      if (domain.icon) {
        var icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = domain.icon;
        header.appendChild(icon);
      }
      var h2 = document.createElement("h2");
      h2.textContent = domain.name || domain.slug;
      header.appendChild(h2);
      section.appendChild(header);

      if (domain.description) {
        var desc = document.createElement("p");
        desc.className = "domain-description";
        desc.textContent = domain.description;
        section.appendChild(desc);
      }

      var grid = document.createElement("div");
      grid.className = "articles-grid";

      var items = domain.articles || domain.papers || [];
      for (var i = 0; i < items.length; i++) {
        grid.appendChild(cardBuilder(items[i]));
      }

      section.appendChild(grid);
      return section;
    }

    // ── Article card builder ──
    function buildArticleCard(article) {
      var card = document.createElement("article");
      card.className = "article-card";

      var topRow = document.createElement("div");
      topRow.className = "card-top-row";

      var h3 = document.createElement("h3");
      var a = document.createElement("a");
      a.href = article.file;
      a.textContent = article.title || article.file;
      h3.appendChild(a);
      topRow.appendChild(h3);

      if (article.quality_score) {
        var badge = document.createElement("span");
        badge.className = "quality-badge " + scoreClass(article.quality_score);
        badge.textContent = article.quality_score + "/10";
        if (article.quality_note) badge.title = article.quality_note;
        topRow.appendChild(badge);
      }

      card.appendChild(topRow);

      if (article.description) {
        var desc = document.createElement("p");
        desc.className = "description";
        desc.textContent = article.description;
        card.appendChild(desc);
      }

      if (article.tags && article.tags.length > 0) {
        var tagsDiv = document.createElement("div");
        tagsDiv.className = "article-tags";
        for (var i = 0; i < article.tags.length; i++) {
          var chip = document.createElement("span");
          chip.className = "tag-badge";
          chip.textContent = article.tags[i];
          tagsDiv.appendChild(chip);
        }
        card.appendChild(tagsDiv);
      }

      if (article.quality_note) {
        var note = document.createElement("p");
        note.className = "quality-note";
        note.textContent = article.quality_note;
        card.appendChild(note);
      }

      if (article.date) {
        var date = document.createElement("time");
        date.className = "date";
        date.textContent = article.date;
        card.appendChild(date);
      }

      return card;
    }

    // ── Paper card builder ──
    function buildPaperCard(paper) {
      var card = document.createElement("article");
      card.className = "article-card paper-card";

      // Top row: title + badge
      var topRow = document.createElement("div");
      topRow.className = "card-top-row";

      var h3 = document.createElement("h3");
      var a = document.createElement("a");
      a.href = paper.file;
      a.target = "_blank";
      a.textContent = paper.title || paper.file;
      h3.appendChild(a);
      topRow.appendChild(h3);

      if (paper.quality_score) {
        var badge = document.createElement("span");
        badge.className = "quality-badge " + scoreClass(paper.quality_score);
        badge.textContent = paper.quality_score + "/10";
        if (paper.quality_note) badge.title = paper.quality_note;
        topRow.appendChild(badge);
      }

      card.appendChild(topRow);

      // Paper meta: authors, year, journal
      var authors = paper.authors || [];
      var metaParts = [];
      if (authors.length > 0) {
        var authStr = authors.length > 3 ? authors[0] + ' et al.' : authors.join(', ');
        metaParts.push(authStr);
      }
      if (paper.year) metaParts.push(String(paper.year));
      if (paper.journal) metaParts.push(paper.journal);

      if (metaParts.length > 0) {
        var meta = document.createElement("p");
        meta.className = "paper-meta";
        meta.textContent = metaParts.join(' · ');
        card.appendChild(meta);
      }

      // Description
      if (paper.description) {
        var desc = document.createElement("p");
        desc.className = "description";
        desc.textContent = paper.description;
        card.appendChild(desc);
      }

      // Tags
      if (paper.tags && paper.tags.length > 0) {
        var tagsDiv = document.createElement("div");
        tagsDiv.className = "article-tags";
        for (var i = 0; i < paper.tags.length; i++) {
          var chip = document.createElement("span");
          chip.className = "tag-badge";
          chip.textContent = paper.tags[i];
          tagsDiv.appendChild(chip);
        }
        card.appendChild(tagsDiv);
      }

      // Quality note
      if (paper.quality_note) {
        var note = document.createElement("p");
        note.className = "quality-note";
        note.textContent = paper.quality_note;
        card.appendChild(note);
      }

      // DOI
      if (paper.doi) {
        var doiP = document.createElement("p");
        doiP.className = "paper-doi";
        var doiA = document.createElement("a");
        doiA.href = "https://doi.org/" + paper.doi;
        doiA.target = "_blank";
        doiA.textContent = paper.doi;
        doiP.appendChild(doiA);
        card.appendChild(doiP);
      }

      // Date
      if (paper.date) {
        var date = document.createElement("time");
        date.className = "date";
        date.textContent = paper.date;
        card.appendChild(date);
      }

      // Action buttons
      var actions = document.createElement("div");
      actions.className = "paper-actions";

      if (paper.vulgarisation_file) {
        var vBtn = document.createElement("a");
        vBtn.href = paper.vulgarisation_file;
        vBtn.target = "_blank";
        vBtn.className = "action-btn";
        vBtn.innerHTML = '<span class="tab-icon">📚</span> Vulgarisation';
        actions.appendChild(vBtn);
      }

      if (paper.lca_file) {
        var lBtn = document.createElement("a");
        lBtn.href = paper.lca_file;
        lBtn.target = "_blank";
        lBtn.className = "action-btn";
        lBtn.innerHTML = '<span class="tab-icon">📋</span> LCA';
        actions.appendChild(lBtn);
      }

      if (actions.childNodes.length > 0) {
        card.appendChild(actions);
      }

      return card;
    }

    // ── Render articles tab (filtered by source) ──
    function renderArticlesTab(manifest, container, filterFn, source) {
      var domains = manifest.domains || [];
      var uncategorized = manifest.uncategorized || [];

      // Filter by source, then separate main vs trash
      var mainDomains = [];
      var trashArticles = [];
      for (var i = 0; i < domains.length; i++) {
        var kept = [];
        var articles = domains[i].articles || [];
        for (var j = 0; j < articles.length; j++) {
          var art = articles[j];
          if ((art.source || 'twitter') !== source) continue;
          if (art.quality_score && art.quality_score <= 4) {
            trashArticles.push(art);
          } else {
            kept.push(art);
          }
        }
        if (kept.length > 0) {
          mainDomains.push({ slug: domains[i].slug, name: domains[i].name, description: domains[i].description, icon: domains[i].icon, articles: kept });
        }
      }

      // Source-filter uncategorized
      var filteredUncat = [];
      for (var k = 0; k < uncategorized.length; k++) {
        if ((uncategorized[k].source || 'twitter') === source) filteredUncat.push(uncategorized[k]);
      }
      uncategorized = filteredUncat;

      // Apply user filter if provided
      if (filterFn) {
        var filteredDomains = [];
        for (var i = 0; i < mainDomains.length; i++) {
          var filtered = mainDomains[i].articles.filter(filterFn);
          if (filtered.length > 0) {
            filteredDomains.push({ slug: mainDomains[i].slug, name: mainDomains[i].name, description: mainDomains[i].description, icon: mainDomains[i].icon, articles: filtered });
          }
        }
        mainDomains = filteredDomains;
        uncategorized = uncategorized.filter(filterFn);
        trashArticles = trashArticles.filter(filterFn);
      }

      var totalArticles = mainDomains.reduce(function(sum, d) { return sum + d.articles.length; }, 0) + uncategorized.length + trashArticles.length;
      var totalDomains = mainDomains.length;
      window._tabSubtitles[source] = totalArticles + ' articles / ' + totalDomains + ' catégories';

      container.textContent = "";

      if (totalArticles === 0 && filterFn) {
        container.appendChild(buildNoResults());
        return;
      }

      if (totalArticles === 0) {
        var emptyDiv = document.createElement('div');
        emptyDiv.className = 'welcome-message';
        var emptyP = document.createElement('p');
        emptyP.textContent = 'Aucun ' + (TAB_LABELS[source] || 'article') + ' pour le moment.';
        emptyDiv.appendChild(emptyP);
        container.appendChild(emptyDiv);
        return;
      }

      if (source === 'twitter' && manifest.observations && !filterFn) {
        container.appendChild(buildObservationsBox(manifest.observations));
      }

      for (var i = 0; i < mainDomains.length; i++) {
        container.appendChild(buildDomainSection(mainDomains[i], buildArticleCard));
      }

      if (uncategorized.length > 0) {
        container.appendChild(buildDomainSection({
          name: "Divers", description: "Articles non catégorisés", icon: "📂", articles: uncategorized
        }, buildArticleCard));
      }

      if (trashArticles.length > 0) {
        container.appendChild(buildDomainSection({
          name: "Poubelle", description: "Articles de faible qualité (score ≤ 4/10)", icon: "🗑️", articles: trashArticles
        }, buildArticleCard));
      }
    }

    // ── Render publications tab ──
    function renderPublicationsTab(manifest, container, filterFn) {
      container.textContent = "";

      if (!manifest.papers || !manifest.papers.domains || manifest.papers.domains.length === 0) {
        window._tabSubtitles['publications'] = '0 publications';
        var emptyDiv = document.createElement('div');
        emptyDiv.className = 'welcome-message';
        var p1 = document.createElement('p');
        p1.textContent = 'Aucune publication pour le moment.';
        emptyDiv.appendChild(p1);
        container.appendChild(emptyDiv);
        return;
      }

      var paperDomains = manifest.papers.domains;

      // Separate main vs trash (no mutation)
      var mainDomains = [];
      var trashPapers = [];
      for (var i = 0; i < paperDomains.length; i++) {
        var kept = [];
        var papers = paperDomains[i].papers || [];
        for (var j = 0; j < papers.length; j++) {
          if (papers[j].quality_score && papers[j].quality_score <= 4) {
            trashPapers.push(papers[j]);
          } else {
            kept.push(papers[j]);
          }
        }
        if (kept.length > 0) {
          mainDomains.push({ slug: paperDomains[i].slug, name: paperDomains[i].name, description: paperDomains[i].description, icon: paperDomains[i].icon, papers: kept });
        }
      }

      // Apply filter if provided
      if (filterFn) {
        var filteredDomains = [];
        for (var i = 0; i < mainDomains.length; i++) {
          var filtered = mainDomains[i].papers.filter(filterFn);
          if (filtered.length > 0) {
            filteredDomains.push({ slug: mainDomains[i].slug, name: mainDomains[i].name, description: mainDomains[i].description, icon: mainDomains[i].icon, papers: filtered });
          }
        }
        mainDomains = filteredDomains;
        trashPapers = trashPapers.filter(filterFn);
      }

      var totalPapers = mainDomains.reduce(function(sum, d) { return sum + d.papers.length; }, 0) + trashPapers.length;
      var totalDomains = mainDomains.length;
      window._tabSubtitles['publications'] = totalPapers + ' publications / ' + totalDomains + ' axes';

      if (totalPapers === 0 && filterFn) {
        container.appendChild(buildNoResults());
        return;
      }

      if (manifest.papers.observations && !filterFn) {
        container.appendChild(buildObservationsBox(manifest.papers.observations));
      }

      for (var i = 0; i < mainDomains.length; i++) {
        container.appendChild(buildDomainSection(mainDomains[i], buildPaperCard));
      }

      if (trashPapers.length > 0) {
        container.appendChild(buildDomainSection({
          name: "Poubelle", description: "Publications de faible qualité (score ≤ 4/10)", icon: "🗑️", papers: trashPapers
        }, buildPaperCard));
      }
    }

    // ── Main app ──
    (async function () {
      try {
        var response = await fetch("manifest.json");
        if (!response.ok) throw new Error("Manifeste introuvable");

        window._manifest = await response.json();

        // Stamp _domainSlug on each item once (no repeated mutation)
        function stampDomainSlugs(domainList, key) {
          for (var i = 0; i < domainList.length; i++) {
            var items = domainList[i][key] || [];
            for (var j = 0; j < items.length; j++) {
              items[j]._domainSlug = domainList[i].slug;
            }
          }
        }
        stampDomainSlugs(window._manifest.domains || [], 'articles');
        if (window._manifest.papers && window._manifest.papers.domains) {
          stampDomainSlugs(window._manifest.papers.domains, 'papers');
        }

        var twitterContainer = document.getElementById("tab-twitter");
        var mediumContainer = document.getElementById("tab-medium");
        var linkedinContainer = document.getElementById("tab-linkedin");
        var publicationsContainer = document.getElementById("tab-publications");

        renderArticlesTab(window._manifest, twitterContainer, null, 'twitter');
        renderArticlesTab(window._manifest, mediumContainer, null, 'medium');
        renderArticlesTab(window._manifest, linkedinContainer, null, 'linkedin');
        renderPublicationsTab(window._manifest, publicationsContainer, null);

        // Init filters UI
        if (typeof initFilters === 'function') initFilters();

        // Apply initial tab
        switchTab(currentTab);
      } catch (e) {
        var errContainer = document.getElementById("tab-twitter");
        errContainer.textContent = '';
        var welcomeDiv = document.createElement('div');
        welcomeDiv.className = 'welcome-message';
        var p1 = document.createElement('p');
        p1.textContent = 'Bienvenue sur Curax.';
        welcomeDiv.appendChild(p1);
        var p2 = document.createElement('p');
        p2.textContent = 'Ajoutez des articles dans le dossier articles/ et poussez sur main pour les voir apparaître ici.';
        welcomeDiv.appendChild(p2);
        errContainer.appendChild(welcomeDiv);
        window._tabSubtitles = {};
        switchTab('twitter');
      }
    })();
  </script>
