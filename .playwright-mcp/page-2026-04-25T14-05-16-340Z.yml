      - generic [ref=e5563]:
        - heading "Analyse du corpus" [level=2] [ref=e5564]
        - paragraph [ref=e5565]: Le corpus confirme une concentration massive sur les agents IA (scaling du test-time compute, auto-évolution sans récompense, mémoire décisionnelle stateless, compression observationnelle pour harnesses terminaux) et une sophistication croissante de la critique interne des MAS (effondrement de diversité par couplage structurel dans l'idéation ouverte). On note une tendance forte vers les régimes sans supervision humaine explicite — self-play scalable avec self-guidance, exploration de connaissances sans reward shaping — signalant un déplacement méthodologique du RLHF classique vers des objectifs émergents. Les laboratoires industriels lourds (Meta Superintelligence Labs, Tencent, Stanford) dominent les contributions de scaling, tandis que la lacune principale reste l'évaluation indépendante et reproductible de ces dynamiques d'auto-amélioration en conditions réelles.
      - generic [ref=e5566]:
        - generic [ref=e5567]:
          - generic [ref=e5568]: 🔧
          - heading "Entraînement LLM" [level=2] [ref=e5569]
        - paragraph [ref=e5570]: Méthodes de pré-entraînement (incluant formats bas-débit type NVFP4), post-entraînement, reinforcement learning pour tâches agentiques, distillation, filtrage de données, reward modeling avec critiques multidimensionnelles explicites, atténuation du mode collapse et diversité des sorties post-alignement, entraînement mémoire-centrique à grande échelle, mise à jour dynamique des poids en déploiement via Test-Time Training in-place, analyse et correction des effets du fine-tuning sur les hallucinations factuelles, scaling du self-play LLM avec guidance pour dépasser les plateaux d'apprentissage conjecturer/solver, modèles de fondation agentiques hybrides Mamba-Attention Mixture-of-Experts pour le vibe coding et l'ingénierie agentique, contrôle des capacités des grands modèles de langage
