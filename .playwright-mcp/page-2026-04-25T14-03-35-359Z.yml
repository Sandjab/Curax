        - heading "Analyse du corpus" [level=2] [ref=e61]
        - paragraph [ref=e62]: Le corpus, désormais massivement dominé par les axes Agents IA et Claude Code, consacre le harness engineering comme troisième pilier du logiciel aux côtés du prompt et du context engineering, avec une convergence forte autour des skills composables (skill graphs, SKILL.md, AGENTS.md) et des boucles d'auto-amélioration récursives type Compound Engineering. Le versant recherche s'enrichit de fondamentaux mathématiques (RoPE, continual learning, moteurs d'inférence continuous batching) qui comblent partiellement la lacune théorique face à la profusion d'articles opérationnels. La sécurité IA gagne en maturité avec l'émergence d'une doctrine shadow-agents (identités scopées, monitoring comportemental, scanners SAST pour vibe-code), tandis que le volet business capte la première onde de choc SaaS (Figma −1 Md$) — signal d'une disruption qui reste sous-analysée dans le corpus au regard de son ampleur.
